name: Build Windows Executable (.exe)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permette di avviare la compilazione manualmente con un clic da GitHub

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 📥 Scarica il codice sorgente
        uses: actions/checkout@v4

      - name: 🟢 Configura Node.js per il Frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 🏗️ Compilazione Frontend (Vite)
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: 🐍 Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installa Dipendenze Python e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: ⚙️ Compila Eseguibile Windows (.exe)
        run: |
          pyinstaller --clean build.spec

      - name: 🚀 Carica File Eseguibile come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetruzziManager-Windows-EXE
          path: dist/PetruzziManager.exe
          if-no-files-found: error
          retention-days: 30
